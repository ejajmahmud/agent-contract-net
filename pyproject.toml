[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-contract-net"
version = "0.1.0"
description = "Contract Net Protocol (CNP) task negotiation framework where agents bid on tasks based on capabilities and cost"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-contract-net = "agent_contract_net.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_contract_net*"]
